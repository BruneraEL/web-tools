<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cash Flow</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4da3ff">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #0f1115;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 25px;
  color: #4da3ff;
}

.card {
  background: #181c24;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}

.best-card {
  border: 2px solid #4da3ff;
}

.best-title {
  color: #4da3ff;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.card-name {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 8px;
}

.days {
  font-size: 24px;
  font-weight: 600;
  color: #ffffff;
}

.small {
  color: #b0b8c5;
  font-size: 14px;
}

.rank-item {
  padding: 12px 0;
  border-bottom: 1px solid #2a303c;
}

.rank-item:last-child {
  border-bottom: none;
}

.medal {
  font-size: 20px;
}

.date {
  color: #9db3d3;
}

.footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 15px;
}
</style>

<script>
const cartoes = [
{
  nome: "Mastercard (Platinum+)",
  melhorDiaCompra: 10,
  vencimentoDia: 17
},
{
  nome: "Visa (Signature)",
  melhorDiaCompra: 21,
  vencimentoDia: 28
},
{
  nome: "Nubank",
  melhorDiaCompra: 2,
  vencimentoDia: 9
}
];

function diferencaDias(d1, d2) {
  const msDia = 1000 * 60 * 60 * 24;
  return Math.ceil((d2 - d1) / msDia);
}

function calcularPagamento(cartao) {

  const hoje = new Date();

  let mes = hoje.getMonth();
  let ano = hoje.getFullYear();

  if (hoje.getDate() >= cartao.melhorDiaCompra) {
    mes += 1;
  }

  return new Date(
    ano,
    mes,
    cartao.vencimentoDia
  );
}

function gerarRanking() {

  const hoje = new Date();

  return cartoes.map(cartao => {

    const pagamento = calcularPagamento(cartao);

    return {
      ...cartao,
      dataPagamento: pagamento,
      dias: diferencaDias(hoje, pagamento)
    };

  }).sort((a,b) => b.dias - a.dias);
}

function renderizar() {

  const hoje = new Date();

  document.getElementById("dataAtual").innerHTML =
    "📅 " +
    hoje.toLocaleDateString("pt-BR");

  const ranking = gerarRanking();

  const melhor = ranking[0];

document.getElementById("melhor").innerHTML = `
<div class="best-title">
  🏆 Melhor cartão para usar hoje
</div>

<div class="card-name">
  ${melhor.nome}
</div>

<div class="days">
  ${melhor.dias} dias de prazo
</div>

<div class="small">
  Pagamento em:
  ${melhor.dataPagamento.toLocaleDateString("pt-BR")}
</div>
`;

  let htmlRanking = "";

  ranking.forEach((cartao, index) => {

    const medalha =
      index === 0 ? "🥇" :
      index === 1 ? "🥈" :
      "🥉";

htmlRanking += `
  <div class="rank-item">

    <strong>
      ${medalha} ${cartao.nome} - ${cartao.dias} dias
    </strong>

    <br>

    <span class="date">
      Pagamento em:
      ${cartao.dataPagamento.toLocaleDateString("pt-BR")}
    </span>

  </div>
`;
  });

  document.getElementById("ranking").innerHTML =
    htmlRanking;
}
</script>

</head>

<body onload="renderizar()">

<div class="container">

<h1>💳 Cash Flow</h1>

<div class="card">
  <div id="dataAtual"></div>
</div>

<div class="card best-card">
  <div id="melhor"></div>
</div>

<div class="card">
  <h3>📊 Ranking</h3>
  <div id="ranking"></div>
</div>

<div class="footer">
  Cash Flow - Credit Card <br>
    <br>
     • Brunera EL Labs •
</div>

</div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
</body>
</html>
